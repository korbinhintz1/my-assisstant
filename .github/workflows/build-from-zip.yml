name: Build My Assisstant from ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MyAssisstant_Source_Logo_and_Windows_Build.zip'
      - '.github/workflows/build-from-zip.yml'
permissions:
  contents: read
concurrency:
  group: my-assisstant-windows-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: extracted/MyAssisstant
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract uploaded source ZIP
        shell: pwsh
        working-directory: .
        run: |
          Expand-Archive -LiteralPath 'MyAssisstant_Source_Logo_and_Windows_Build.zip' -DestinationPath 'extracted' -Force
          if (!(Test-Path 'extracted/MyAssisstant/main.py')) { throw 'Source ZIP does not contain the expected MyAssisstant/main.py' }
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run core tests and syntax checks
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q core ui main.py build_windows.py
      - name: Windows import smoke test
        run: python -c "import main; import sounddevice; from PySide6.QtMultimedia import QAudioBufferOutput; print('Windows imports OK')"
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build portable executable and setup installer
        run: python build_windows.py
      - name: Verify outputs and create SHA-256 checksums
        shell: pwsh
        run: |
          $targets = @('dist/portable/MyAssisstant_Portable.exe', 'dist/setup/MyAssisstant_Setup.exe')
          $lines = foreach ($target in $targets) {
            if (!(Test-Path $target) -or (Get-Item $target).Length -eq 0) { throw "Missing package: $target" }
            $hash = (Get-FileHash $target -Algorithm SHA256).Hash
            "$hash  $([System.IO.Path]::GetFileName($target))"
          }
          $lines | Set-Content -Path 'dist/SHA256SUMS.txt' -Encoding ascii
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: MyAssisstant-Windows-x64
          path: |
            extracted/MyAssisstant/dist/portable/MyAssisstant_Portable.exe
            extracted/MyAssisstant/dist/setup/MyAssisstant_Setup.exe
            extracted/MyAssisstant/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
